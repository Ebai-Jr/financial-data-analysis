<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Financial Analysis Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: auto;
        }

        .chatbot {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background-color: #333;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #555;
        }

        .response {
            margin-top: 25px;
            padding: 18px;
            background-color: #f0f2f4;
            border-radius: 8px;
        }

        .response h3 {
            margin-top: 0;
        }

        .questions {
            margin-top: 30px;
        }

        .questions h3 {
            margin-bottom: 10px;
        }

        .questions ul {
            padding-left: 20px;
        }

        .questions li {
            margin-bottom: 8px;
            color: #555;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 13px;
        }

        .question-button {
            display: block;
            width: 100%;
            margin-bottom: 10px;
            padding: 12px;
            background-color: #f4f6f8;
            color: #333;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
        }

        .question-button:hover {
            background-color: #e8ebee;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="chatbot">

            <h1>Financial Analysis Chatbot</h1>

            <p class="description">
                Ask questions about the financial performance of Microsoft,
                Apple, and Tesla from 2023 to 2025.
            </p>


            <form method="POST">

                <input
                    type="text"
                    name="user_query"
                    placeholder="Ask a financial question..."
                    value="{{ user_query }}"
                    required
                >

                <button type="submit">Ask</button>

            </form>


            {% if response %}

            <div class="response">

                <h3>Chatbot Response</h3>

                <p>{{ response }}</p>

            </div>

            {% endif %}


            <div class="questions">

                <h3>Example Questions</h3>

                <button type="button"
                        class="question-button"
                        onclick="askQuestion(this.textContent)">
                    What was Apple's total revenue in 2025?
                </button>

                <button type="button"
                        class="question-button"
                        onclick="askQuestion(this.textContent)">
                    What was Microsoft's net income in 2025?
                </button>

                <button type="button"
                        class="question-button"
                        onclick="askQuestion(this.textContent)">
                    How did Tesla's revenue change from 2024 to 2025?
                </button>

                <button type="button"
                        class="question-button"
                        onclick="askQuestion(this.textContent)">
                    How did Apple's net income change from 2024 to 2025?
                </button>

                <button type="button"
                        class="question-button"
                        onclick="askQuestion(this.textContent)">
                    What was the average revenue for Microsoft from 2023 to 2025?
                </button>

            </div>

        </div>


        <div class="footer">
            Financial Analysis Chatbot | Built with Python, Pandas and Flask
        </div>

    </div>

    <script>
        function askQuestion(question) {
            document.querySelector('input[name="user_query"]').value = question.trim();
        }
    </script>

</body>

</html>
